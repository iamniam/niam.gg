---
layout: default
---
<main>
  <a class="back" href="{{ '/' | relative_url }}">homepage</a>
  <article>
    <p class="date post-date"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %-d, %Y' | downcase }}</time></p>
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-body">{{ content }}</div>
  </article>
</main>
